blueprint:
  name: Gradual Cover Open
  description: >
    Opens a cover in steps every configurable interval, only on selected weekdays, skipping when holiday mode is active.
  domain: automation

  input:
    cover_entity:
      name: Cover
      selector:
        entity:
          domain: cover

    step:
      name: Step size (%)
      description: How much to open the cover each interval
      default: 20
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    interval_minutes:
      name: Interval (minutes)
      description: How often to open the cover by a step
      default: 5
      selector:
        number:
          min: 1
          max: 60

    target_position:
      name: Target position (%)
      default: 100
      selector:
        number:
          min: 1
          max: 100
          unit_of_measurement: "%"

    start_time:
      name: Earliest start time
      selector:
        time: {}

    weekdays:
      name: Weekdays
      description: Days on which the automation should run
      default: [mon, tue, wed, thu, fri]
      selector:
        select:
          multiple: true
          options:
            - {label: Monday, value: mon}
            - {label: Tuesday, value: tue}
            - {label: Wednesday, value: wed}
            - {label: Thursday, value: thu}
            - {label: Friday, value: fri}
            - {label: Saturday, value: sat}
            - {label: Sunday, value: sun}

    holiday_mode:
      name: Holiday mode helper
      description: If ON, automation will not run
      default: []
      selector:
        entity:
          domain: input_boolean

trigger:
  # Trigger every minute
  - platform: time_pattern
    minutes: "*"

variables:
  cover_entity: !input cover_entity
  step: !input step
  interval_minutes: !input interval_minutes
  target_position: !input target_position
  start_time: !input start_time
  weekdays: !input weekdays
  holiday_mode_entity: !input holiday_mode

condition:
  # Interval check
  - condition: template
    value_template: >
      {% set interval = interval_minutes | int %}
      {% if interval <= 0 %}
        false
      {% else %}
        now().minute % interval == 0
      {% endif %}

  # After chosen start time
  - condition: time
    after: "{{ start_time }}"

  # Only on selected weekdays
  - condition: template
    value_template: >
      {{ now().strftime('%a') | lower in weekdays }}

  # Holiday mode OFF (if provided)
  - condition: template
    value_template: >
      {{ holiday_mode_entity == [] or is_state(holiday_mode_entity, 'off') }}

action:
  - choose:
      # Open cover step if below target
      - conditions:
          - condition: template
            value_template: >
              {{ (state_attr(cover_entity, 'current_position') | int(0)) < target_position }}
        sequence:
          - service: cover.set_cover_position
            target:
              entity_id: "{{ cover_entity }}"
            data:
              position: >
                {{ [
                  (state_attr(cover_entity, 'current_position') | int(0)) + step,
                  target_position
                ] | min }}

mode: single